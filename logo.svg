<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="120" viewBox="0 0 520 120"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Wordmark: Kurma Capi -->
  <text x="10" y="58"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="44"
        font-weight="500"
        fill="#0F172A"
        letter-spacing="0.5">
    Kurma Capi
  </text>

  <!-- Custom T (perfect baseline alignment) -->
  <!-- Vertical stem -->
  <rect x="292" y="26" width="6" height="34" rx="2" fill="#0B2A3F"/>

  <!-- Horizontal bar -->
  <rect x="282" y="26" width="26" height="6" rx="2" fill="#0B2A3F"/>

  <!-- Cycle arc (subtle, centered) -->
  <path d="M282 66 A18 18 0 0 0 308 66"
        fill="none"
        stroke="#2C8FD6"
        stroke-width="2"/>

  <!-- Wordmark continuation: al -->
  <text x="314" y="58"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="44"
        font-weight="500"
        fill="#0F172A"
        letter-spacing="0.5">
    al
  </text>

  <!-- Tagline -->
  <text x="12" y="92"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="400"
        fill="#475569"
        letter-spacing="1.1">
    Perspective Over Cycles
  </text>

</svg>
