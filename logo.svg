<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="120" viewBox="0 0 520 120"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Background (transparent) -->
  <rect width="520" height="120" fill="transparent"/>

  <!-- Wordmark -->
  <text x="10" y="55"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="44"
        font-weight="500"
        fill="#0F172A"
        letter-spacing="0.5">
    Kurma Cap
  </text>

  <!-- Stylized T (Endurance Pillar) -->
  <rect x="305" y="20" width="6" height="40" rx="2" fill="#0B2A3F"/>
  <rect x="296" y="20" width="24" height="6" rx="2" fill="#0B2A3F"/>

  <!-- Cycle Arc (Subtle) -->
  <path d="M295 62 A18 18 0 0 0 320 62"
        fill="none"
        stroke="#2C8FD6"
        stroke-width="2"/>

  <!-- Rest of word -->
  <text x="322" y="55"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="44"
        font-weight="500"
        fill="#0F172A"
        letter-spacing="0.5">
    al
  </text>

  <!-- Tagline -->
  <text x="12" y="92"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="400"
        fill="#475569"
        letter-spacing="1.2">
    Perspective Over Cycles
  </text>

</svg>
